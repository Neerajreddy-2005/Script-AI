# Netlify builds the frontend from the frontend/ folder on every push.
# Set VITE_* variables in Netlify -> Site configuration -> Environment variables (never in this file).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: let React Router handle /login, /dashboard, ... on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. frame-ancestors / X-Frame-Options stop other sites from framing the app
# (clickjacking); the CSP only allows scripts from this site and API calls to our backend and Supabase.
# If the backend URL changes, update connect-src too.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script-ai-api.onrender.com https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
