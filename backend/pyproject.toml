[project]
name = "script-ai-backend"
version = "2.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# W191: the codebase uses tabs. B008: FastAPI's Depends()/File() defaults are idiomatic.
ignore = ["W191", "E101", "B008", "E501", "UP007"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
